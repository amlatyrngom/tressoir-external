<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#f6f6f4; --panel:#ffffff; --fg:#1b1c1f; --muted:#70747d; --line:#c9ccd2; --accent:#2457c5; --accent-soft:#e6edfb; --add:#1d7a46; --chg:#9a5b00; --del:#a33030;
  --entry:#2f74c0; --core:#6b4fc8; --plat:#5f6672; --ext:#0e8aa8; }
@media (prefers-color-scheme: dark) { :root { --bg:#131417; --panel:#1b1d21; --fg:#e8e8eb; --muted:#9a9ea7; --line:#454952; --accent:#8fb0ff; --accent-soft:#1f2b47; --add:#6fd39b; --chg:#e8b25a; --del:#f0a0a0;
  --entry:#7db4ea; --core:#a996f0; --plat:#a3a8b3; --ext:#5cc6de; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width:1500px; margin:0 auto; padding:12px 14px 40px; }
button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; white-space:nowrap; }

.ctl { display:flex; align-items:center; gap:16px; margin:0 2px 10px; flex-wrap:wrap; row-gap:6px; }
.pick { display:inline-flex; gap:16px; align-items:baseline; }
.pick button { color:var(--muted); padding:2px 0; border-bottom:2px solid transparent; }
.pick button[aria-pressed="true"] { color:var(--fg); font-weight:600; border-bottom-color:var(--accent); }
#mode { flex-wrap:wrap; row-gap:2px; }
#mode .div { align-self:stretch; width:1px; background:var(--line); margin:0 2px; }
.right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; } .counts { margin-left:6px; }
.chip { border:1px solid var(--line); border-radius:5px; padding:2px 10px; color:var(--muted); font-size:13px; }
.chip[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--fg); }
.chip:disabled { opacity:.4; cursor:default; }
.counts { font-weight:600; font-variant-numeric:tabular-nums; display:flex; gap:10px; min-width:92px; justify-content:flex-end; }
.c.add { color:var(--add); } .c.chg { color:var(--chg); } .c.del { color:var(--del); } .c.zero { opacity:.35; }
@media (max-width:480px) { .ctl, .pick, .right { gap:10px; } .counts { min-width:0; gap:7px; } }

/* moving between views: a line of names above the state tabs; a dot on a name when something under it changed */
.vnav { display:flex; align-items:baseline; gap:6px 20px; margin:0 2px 8px; flex-wrap:wrap; font-size:15.5px; }
.vnav button { color:var(--muted); padding:1px 0 2px; border-bottom:2px solid transparent; display:inline-flex; gap:6px; align-items:baseline; }
.vnav button[aria-pressed="true"] { color:var(--fg); font-weight:650; border-bottom-color:var(--fg); }
.vnav .div { align-self:stretch; width:1px; background:var(--line); }
.dotm { width:6px; height:6px; border-radius:50%; background:var(--chg); display:inline-block; align-self:center; }
/* a two-way switch between the parts of the system and the flows through it */
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; font-size:13px; align-self:center; }
.seg button, .vnav .seg button { padding:2px 11px; border:0; display:inline-flex; gap:5px; align-items:center; color:var(--muted); } .seg button[aria-pressed="true"], .vnav .seg button[aria-pressed="true"] { background:var(--accent-soft); color:var(--fg); font-weight:600; }

.pane { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:12px; }
@media (min-width:860px) { .cols { display:grid; grid-template-columns:minmax(0, 3fr) minmax(0, 2fr); gap:12px; align-items:start; } .cols .files { position:sticky; top:8px; max-height:calc(100vh - 16px); overflow:auto; } }
.fhead { display:flex; justify-content:flex-end; align-items:center; margin:-2px -4px 2px 0; } .fhead .seg { margin-right:auto; font-size:12.5px; } .fhead > button { color:var(--muted); border-radius:5px; padding:3px 5px; line-height:0; } .fhead > button:hover { color:var(--fg); background:color-mix(in srgb, var(--line) 40%, transparent); }

/* the figure: positions computed from the data, drawn 668 wide and scaled to fit */
.figwrap { position:relative; overflow:hidden; } .stage { position:absolute; left:0; top:0; width:668px; transform-origin:0 0; }
.stage svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.entry { --k:var(--entry); } .core { --k:var(--core); } .plat { --k:var(--plat); } .ext { --k:var(--ext); } .sep { --k:var(--muted); }
.rg { position:absolute; border:1px solid color-mix(in srgb, var(--k) 45%, var(--panel)); border-radius:9px; background:color-mix(in srgb, var(--k) 7%, var(--panel)); cursor:pointer; }
.rg b { position:absolute; white-space:nowrap; font-size:9.5px; line-height:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--k); font-weight:700; }
.rg.sel { box-shadow:0 0 0 2px var(--k); }
.nd { --bd:var(--line); position:absolute; display:grid; place-items:center; border:1.5px solid var(--bd); border-radius:6px; background:var(--panel); font-size:12.5px; font-weight:650; line-height:1.1; text-align:center; overflow-wrap:anywhere; cursor:pointer; }
/* a name wraps onto a second line only where its box is too narrow for it; pills and chips are sized to their text */
.nd.tight { font-size:11px; } .nd.pill, .nd.near { white-space:nowrap; }
.nd.util { border-style:dashed; font-weight:500; }
.nd.add { --bd:var(--add); background:color-mix(in srgb, var(--add) 13%, var(--panel)); color:var(--add); }
.nd.chg { --bd:var(--chg); background:color-mix(in srgb, var(--chg) 13%, var(--panel)); color:var(--chg); }
.nd.del { --bd:var(--del); border-style:dashed; color:var(--del); text-decoration:line-through; }
/* NEW: a box that has its own view looks like the top sheet of a small stack */
.nd.has { box-shadow:3.5px 3.5px 0 -1.5px var(--panel), 3.5px 3.5px 0 0 var(--bd); }
.nd.sel { box-shadow:0 0 0 2.5px var(--fg); } .nd.has.sel { box-shadow:0 0 0 2.5px var(--fg), 5px 5px 0 -1.5px var(--panel), 5px 5px 0 0 var(--bd); }
/* NEW: a box that lives in another view, shown at the edge of this one */
.nd.near { border-radius:13px; font-size:11.5px; font-weight:550; }
.sd { min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--fg); color:var(--panel); font:700 10px/16px system-ui, sans-serif; text-align:center; font-style:normal; }
/* a flow drawn as lanes: one column per overview box on its path, one row per step */
.sd { position:absolute; cursor:pointer; } .sd.sel, .sd.ref { box-shadow:0 0 0 2.5px var(--panel), 0 0 0 4.5px var(--fg); }
.nd.pill { border-radius:11px; font-size:11.5px; font-weight:550; }
.nd .sw, .r .sw { display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--k); margin-right:6px; }
.life { stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 4; }
.lab { position:absolute; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; white-space:nowrap; } .lab.gone { color:var(--del); }
.ed { color:var(--muted); }
.ed .ln { fill:none; stroke:currentColor; stroke-width:1.3; }
.only .nd.same { opacity:.5; } .only .nd.sel { opacity:1; } .ed polygon, .ed circle { fill:currentColor; }
.ed .hit { fill:none; stroke:transparent; stroke-width:12; pointer-events:stroke; cursor:pointer; }
.ed text { font:9.5px system-ui, sans-serif; fill:currentColor; paint-order:stroke; stroke:var(--panel); stroke-width:3.5px; stroke-linejoin:round; }
.ed.con .ln { stroke-width:2.4; } .ed.sel .ln { stroke-width:3; }

/* the strip under the figure */
.strip { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; min-height:132px; font-size:13.5px; }
.strip .t { margin:0 0 6px; } .strip .t b { font-weight:650; } .strip .m { color:var(--muted); }
.strip .dl { display:flex; gap:8px; align-items:baseline; } .strip .dl .g { flex:0 0 12px; text-align:center; font-weight:700; }
.strip .dl.add .g { color:var(--add); } .strip .dl.chg .g { color:var(--chg); } .strip .dl.del .g { color:var(--del); }
.strip .hint { color:var(--muted); } .strip .all .dl { border-radius:4px; cursor:default; } .strip .all .dl:hover { background:color-mix(in srgb, var(--line) 40%, transparent); }
@media (min-width:1500px) { .strip .all { columns:2; column-gap:24px; } .strip .all .dl { break-inside:avoid; } }
.nd.ref { box-shadow:0 0 0 2px var(--fg); opacity:1 !important; }
.go { color:var(--accent); font-weight:600; margin-left:10px; } .strip .else { color:var(--muted); margin:6px 0 0 20px; font-size:12.5px; }

/* interfaces: functions and types, under the figure. Two styles and no more: code, in a monospaced face, with the name of a line in bold; and words, small and quiet. A line is a box's name or a signature; a line that changed carries a small mark in the margin. A line opens from itself and from nothing else */
code { font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; } code b { font-weight:600; }
.api { margin:0 0 8px; } .strip .hd { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:10px 0 3px; }
.fn { display:flex; gap:6px; align-items:baseline; font-size:13px; position:relative; } .fn > .g { flex:0 0 12px; text-align:center; font-weight:700; } .fn .m { color:var(--muted); } .fn > .ct { min-width:0; flex:1; }
.ct[data-fold] { cursor:pointer; } .ct[data-fold]:hover b, button.bx:hover { color:var(--accent); }
/* a signature that wraps hangs under itself */
.fn > .ct > code, .tr > code { display:block; padding-left:2ch; text-indent:-2ch; overflow-wrap:anywhere; } .fn button { text-indent:0; }
.fn.add > .g { color:var(--add); } .fn.chg > .g { color:var(--chg); } .fn.del > .g { color:var(--del); } .fn.del > .ct > code { color:var(--muted); text-decoration:line-through; }
.pv { color:var(--muted); }
.ed text.mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:9px; }
/* everything shown at once, group by group: a box's name, in the same style whether it changed or not, then its lines */
.abox { margin:0 0 7px; } .bn { font-weight:650; } .bn .sn { color:var(--muted); font-weight:600; margin-right:6px; font-variant-numeric:tabular-nums; }
/* what an opened line has to say sits under it, behind a rule, and is built the same way at every depth: its words, then why it changed, then what it is made of. The words are one quiet style; the lines under them are lines like any other, with their marks in the gap beside the rule */
.inl { margin:1px 0 5px 18px; padding-left:18px; border-left:2px solid var(--line); } .inl .inl { margin-left:0; }
/* an opened line's words read as comments: the code's own face, all one grey, so the block under a line is one texture. What a line was is a comment too, with the old signature struck */
.wl { color:var(--muted); font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; padding-left:3ch; text-indent:-3ch; overflow-wrap:anywhere; } .wl::before { content:'// '; } .wl code { font:inherit; }
.wl s { text-decoration:line-through; }
/* under an opened line, the change takes a little of the change colour and what the line was a little of the removed colour, so neither reads as the line's own words */
.wl.cn { color:color-mix(in srgb, var(--chg) 62%, var(--muted)); } .wl.ws { color:color-mix(in srgb, var(--del) 62%, var(--muted)); }
.ct > .wl { display:block; }
.tr { display:flex; align-items:baseline; position:relative; } .tr > code { min-width:0; flex:1; }
.inl > .fn > .g, .tr > .g2 { position:absolute; left:-16px; width:12px; text-align:center; font-weight:700; font-size:12px; }
.tr.add, .tr.add .g2, .new { color:var(--add); } .tr.chg .g2 { color:var(--chg); } .tr.del, .old { color:var(--del); text-decoration:line-through; } .tr.del .g2 { text-decoration:none; }

/* files */
.scroll { overflow-x:auto; }
.tree { font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; width:max-content; min-width:100%; }
.r { display:flex; align-items:baseline; gap:8px; white-space:nowrap; padding-right:6px; }
.r .g { flex:0 0 14px; text-align:center; font-weight:700; } .r .p { font:12.5px/1.5 system-ui, sans-serif; color:var(--muted); }
.r.add .g, .r.add .n { color:var(--add); } .r.chg .g, .r.chg .n { color:var(--chg); } .r.del .g, .r.del .n { color:var(--del); } .r.del .n { text-decoration:line-through; }
.r.add .p, .r.chg .p, .r.del .p, .r .p.what { color:var(--fg); }
.diff .r.same { opacity:.5; } .diff .r.same.inside { opacity:1; }
.r .dots { color:var(--muted); }
.r.hot { background:var(--accent-soft); opacity:1 !important; }
.r[data-pick] { cursor:pointer; border-radius:4px; } .r[data-pick]:hover { background:color-mix(in srgb, var(--line) 40%, transparent); } .r.sel { box-shadow:inset 3px 0 0 var(--fg); background:color-mix(in srgb, var(--line) 55%, transparent); opacity:1 !important; }
.r .roll { font:600 12px/1.5 system-ui, sans-serif; display:inline-flex; gap:7px; font-variant-numeric:tabular-nums; }
.foot { font:12px/1.5 system-ui, sans-serif; color:var(--muted); margin:6px 0 0 22px; opacity:.8; }

/* one quiet line under the page: what it was built from, and anything the script had to say */
.built { margin-top:14px; border-top:1px dashed var(--line); padding-top:8px; color:var(--muted); font-size:12px; line-height:1.5; }
.built p { margin:0 0 2px; }
</style>
</head>
<body>
<main>
  <div id="nav"></div>
  <div class="ctl">
    <span class="pick" id="mode"></span>
    <span class="right"><button class="chip" id="only">Changes only</button><span class="counts" id="counts"></span></span>
  </div>
  <div class="cols">
    <section class="pane"><div id="fig"></div><div class="strip" id="strip"></div></section>
    <section class="pane files"><div class="fhead"><button id="fold" title="Collapse to components" aria-label="Collapse to components"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 2.5 8 5.5l3.5-3M2 8h12M4.5 13.5 8 10.5l3.5 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="scroll"><div class="tree" id="tree"></div></div></section>
  </div>
  <div class="built" id="built"></div>
</main>

<script>
// ============ data ============
// Written by system_view.py. Lists hold everything any tab shows; `snap` says, per tab, what is there and how it changed:
//   snap[tab].files[path]  add | chg | del, null when the file is not there; absent when unchanged
//   snap[tab].boxes[folder] the same for a box
//   snap[tab].lines[id]    { s, sig, was, line } for a function or a type, null when it is not there
//   snap[tab].changes      the named changes of that delta (indexes into `changes`); snap[tab].hits their lines
const S = __DATA__;
// ============ state ============
let openT = [], V, flow = null, back = '', mode = 'cc', only = true, hov = null, pin = null, reveal = null, closed = new Set(), LAY = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const mark = { add:'+', chg:'~', del:'−' }, TABS = S.tabs, SN = () => S.snap[mode], delta = () => !!TABS.find(t => t.id === mode).delta;
S.files = S.files.map(f => ({ path:f[0], line:f[1] }));
if (S.api) { Object.keys(S.api).forEach(k => { S.api[k] = S.api[k].map(a => ({ sig:a[0], line:a[1], id:k + '#' + a[0].slice(0, a[0].search(/[^\w.]/) < 0 ? a[0].length : a[0].search(/[^\w.]/)) })); });
  Object.keys(S.types).forEach(k => { const a = S.types[k]; S.types[k] = { sig:a[0], line:a[1], home:a[2], name:k, id:k }; }); }
S.views.forEach(v => { if (v.id) { const b = S.views.flatMap(w => [...w.rows.flatMap(r => r.boxes), ...(w.band ? w.band.boxes : []), ...(w.sep || [])]).find(x => x.folder === v.id); v.name = b.name; v.line = b.line; } });
// ============ reading the snapshot of the tab being shown ============
const own = v => [...v.rows.flatMap(r => r.boxes), ...(v.band ? v.band.boxes : []), ...(v.sep || [])];
const regionsOf = v => [...v.rows, ...(v.band ? [v.band] : [])];
const boxAt = folder => { for (const v of S.views) { const b = own(v).find(x => x.folder === folder); if (b) return b; } };
const regionAt = id => { for (const v of S.views) { const r = regionsOf(v).find(x => x.id === id); if (r) return r; } };
// a folder stands for a region only when one region alone has it
const regionOfDir = dir => { const all = S.views.flatMap(regionsOf).filter(x => x.dir === dir); return all.length === 1 ? all[0] : undefined; };
const viewOf = folder => S.views.find(v => v.id === folder && v.id);          // the view a box opens, if it has one
const homeOf = folder => S.views.find(v => own(v).some(b => b.folder === folder));
const isSep = b => S.views.some(v => (v.sep || []).includes(b));
const rootBox = folder => own(S.views[0]).find(b => folder.startsWith(b.folder));          // the overview box a folder sits in
const slotOf = b => { const r = regionsOf(S.views[0]).find(x => x.boxes.includes(b)); return r ? r.slot : 'sep'; };
const sf = s => s[0];                                                                         // the folder a step of a flow points at: a box at any depth
const stepName = s => { const r = rootBox(s[0]), b = boxAt(sf(s)); return b === r ? r.name : r.name + ' › ' + b.name; };
const under = p => S.files.filter(f => f.path.startsWith(p));
// a file, a function or a type in the tab being shown: '', add, chg, del, or null when it is not there
const entry = x => SN().lines[x.id];
function fst(x){ if (x.path !== undefined) { const v = SN().files[x.path]; return v === undefined ? '' : v; } const e = entry(x); return e === undefined ? '' : e === null ? null : e.s || ''; }
// a box in the tab being shown. It is changed exactly when a file under its paths changed; the script works that out
function bst(b){ const v = SN().boxes[b.folder]; return v === undefined ? '' : v; }
const bstIn = (tab, b) => S.snap[tab].boxes[b.folder];
// the named changes of the delta being shown
const inDelta = () => delta() ? SN().changes.map(i => S.changes[i]) : [];
const touches = (c, folder) => Object.keys(c.files).some(p => p.startsWith(folder));
const touching = folder => inDelta().filter(c => touches(c, folder));
// a change reads as new when it is the one that brings a new box in, and takes none away
function cmark(c){ const boxes = S.views.flatMap(own).filter(b => touches(c, b.folder)); if (boxes.some(b => bst(b) === 'del')) return 'chg';
  return boxes.some(b => bst(b) === 'add' && touching(b.folder)[0] === c) ? 'add' : 'chg'; }
const tally = p => { const t = { add:0, chg:0, del:0 }; under(p).forEach(f => { const s = fst(f); if (s) t[s]++; }); return t; };
const notes = path => inDelta().filter(c => c.files[path]).map(c => c.files[path]);

// ---- interfaces: a few functions per box, and the types that cross between boxes
const there = x => fst(x) !== null;
const fnsOf = folder => (S.api && S.api[folder] || []).filter(there);
const st2 = x => delta() ? fst(x) || '' : '';
// the text of a function or type as of the tab being shown
const nowSig = x => (entry(x) || {}).sig || x.sig, wasOf = x => (entry(x) || {}).was || '', wordsOf = x => (entry(x) || {}).line || x.line;
const names = text => [...new Set((text.match(/[A-Z][A-Za-z]+/g) || []).filter(n => S.types[n] && there(S.types[n])))];
// the named changes of the delta shown that affect a function or type, whether they altered its signature or only what happens behind it. The script places a change on the closest listed line it affects
const hitsOf = c => SN().hits[S.changes.indexOf(c)] || [];
const causes = x => S.api ? inDelta().filter(c => hitsOf(c).includes(x.id)) : [];
// the mark in the margin, one of three: + or − when the delta added or removed the line, ~ when a change affects it
const markOf = x => st2(x) || (causes(x).length ? 'chg' : '');
// a named change, as a comment: its name, then its sentence
const note = c => `<div class="wl cn" data-change="${S.changes.indexOf(c)}">${esc(c.name)}: ${esc(c.line)}</div>`;
// what an opened line says about its change: each named change behind it, then what the line was, as a comment with the old signature struck. A type with fields shows what it was in its rows
function chgNote(x){ const w = wasOf(x), was = st2(x) === 'chg' && w && (!x.name || shape(w).kind === 'alias');
  return causes(x).map(note).join('') + (was ? `<div class="wl ws">was <s>${esc(w)}</s></div>` : ''); }
// one line of code, and what it says when open. The line itself is what opens it; nothing inside it is a button of its own
const codeLine = (x, key, on, code, body) => { const m = markOf(x); return `<div class="fn ${m}"><span class="g">${mark[m] || ''}</span><span class="ct" data-fold="${key}"><code>${code}</code></span></div>${on ? `<div class="inl">${body}</div>` : ''}`; };
const nameOf = (text, on) => `<button class="tn" aria-expanded="${on}"><b>${esc(text)}</b></button>`;
// one function: its signature and nothing else. Open, it gives its words, why it changed, and the types it names, each a type line like any other
function fnLine(f, at){ const sig = nowSig(f), on = openT.includes(at), i = sig.search(/[^\w.]/);
  return codeLine(f, at, on, nameOf(i < 0 ? sig : sig.slice(0, i), on) + (i < 0 ? '' : esc(sig.slice(i))), on ? `<div class="wl">${esc(wordsOf(f))}</div>${chgNote(f)}${names(sig).map(n => typeRow(S.types[n], at + '>' + n, { inline:true })).join('')}` : ''); }
// a shape read one level deep: a record of fields, a choice among variants, or another name for something
