<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#f6f6f4; --panel:#ffffff; --fg:#1b1c1f; --muted:#70747d; --line:#c9ccd2; --accent:#2457c5; --accent-soft:#e6edfb; --add:#1d7a46; --chg:#9a5b00; --del:#a33030;
  --entry:#2f74c0; --core:#6b4fc8; --plat:#5f6672; --ext:#0e8aa8; }
@media (prefers-color-scheme: dark) { :root { --bg:#131417; --panel:#1b1d21; --fg:#e8e8eb; --muted:#9a9ea7; --line:#454952; --accent:#8fb0ff; --accent-soft:#1f2b47; --add:#6fd39b; --chg:#e8b25a; --del:#f0a0a0;
  --entry:#7db4ea; --core:#a996f0; --plat:#a3a8b3; --ext:#5cc6de; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width:1500px; margin:0 auto; padding:12px 14px 40px; }
button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; white-space:nowrap; }

.ctl { display:flex; align-items:center; gap:16px; margin:0 2px 10px; flex-wrap:wrap; row-gap:6px; }
.pick { display:inline-flex; gap:16px; align-items:baseline; max-width:100%; }
.pick button { color:var(--muted); padding:2px 0; border-bottom:2px solid transparent; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.pick button[aria-pressed="true"] { color:var(--fg); font-weight:600; border-bottom-color:var(--accent); }
#mode { flex-wrap:wrap; row-gap:2px; }
#mode .div { align-self:stretch; width:1px; background:var(--line); margin:0 2px; }
.right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; } .counts { margin-left:6px; }
.chip { border:1px solid var(--line); border-radius:5px; padding:2px 10px; color:var(--muted); font-size:13px; }
.chip[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--fg); }
.chip:disabled { opacity:.4; cursor:default; }
.counts { font-weight:600; font-variant-numeric:tabular-nums; display:flex; gap:10px; min-width:92px; justify-content:flex-end; }
.c.add { color:var(--add); } .c.chg { color:var(--chg); } .c.del { color:var(--del); } .c.zero { opacity:.35; }
@media (max-width:480px) { .ctl, .pick, .right { gap:10px; } .counts { min-width:0; gap:7px; } }

/* moving between views: a line of names above the state tabs; a dot on a name when something under it changed */
.vnav { display:flex; align-items:baseline; gap:6px 20px; margin:0 2px 8px; flex-wrap:wrap; font-size:15.5px; }
.vnav button { color:var(--muted); padding:1px 0 2px; border-bottom:2px solid transparent; display:inline-flex; gap:6px; align-items:baseline; }
.vnav button[aria-pressed="true"] { color:var(--fg); font-weight:650; border-bottom-color:var(--fg); }
.vnav .div { align-self:stretch; width:1px; background:var(--line); }
.dotm { width:6px; height:6px; border-radius:50%; background:var(--chg); display:inline-block; align-self:center; }

.pane { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:12px; }
@media (min-width:860px) { .cols { display:grid; grid-template-columns:minmax(0, 3fr) minmax(0, 2fr); gap:12px; align-items:start; } .cols .files { position:sticky; top:8px; max-height:calc(100vh - 16px); overflow:auto; } }
.fhead { display:flex; justify-content:flex-end; align-items:center; margin:-2px -4px 2px 0; } .fhead > button { color:var(--muted); border-radius:5px; padding:3px 5px; line-height:0; } .fhead > button:hover { color:var(--fg); background:color-mix(in srgb, var(--line) 40%, transparent); }

/* the figure: positions computed from the data, drawn 668 wide and scaled to fit */
.figwrap { position:relative; overflow:hidden; } .stage { position:absolute; left:0; top:0; width:668px; transform-origin:0 0; }
.stage svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.entry { --k:var(--entry); } .core { --k:var(--core); } .plat { --k:var(--plat); } .ext { --k:var(--ext); } .sep { --k:var(--muted); }
.rg { position:absolute; border:1px solid color-mix(in srgb, var(--k) 45%, var(--panel)); border-radius:9px; background:color-mix(in srgb, var(--k) 7%, var(--panel)); cursor:pointer; }
.rg b { position:absolute; white-space:nowrap; font-size:9.5px; line-height:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--k); font-weight:700; }
.rg.sel { box-shadow:0 0 0 2px var(--k); }
.nd { --bd:var(--line); position:absolute; display:grid; place-items:center; border:1.5px solid var(--bd); border-radius:6px; background:var(--panel); font-size:12.5px; font-weight:650; line-height:1.1; text-align:center; overflow-wrap:anywhere; cursor:pointer; }
/* a name wraps onto a second line only where its box is too narrow for it; pills and chips are sized to their text */
.nd.tight { font-size:11px; } .nd.near { white-space:nowrap; }
.nd.util { border-style:dashed; font-weight:500; }
.nd.add { --bd:var(--add); background:color-mix(in srgb, var(--add) 13%, var(--panel)); color:var(--add); }
.nd.chg { --bd:var(--chg); background:color-mix(in srgb, var(--chg) 13%, var(--panel)); color:var(--chg); }
.nd.del { --bd:var(--del); border-style:dashed; color:var(--del); text-decoration:line-through; }
/* NEW: a box that has its own view looks like the top sheet of a small stack */
.nd.has { box-shadow:3.5px 3.5px 0 -1.5px var(--panel), 3.5px 3.5px 0 0 var(--bd); }
.nd.sel { box-shadow:0 0 0 2.5px var(--fg); } .nd.has.sel { box-shadow:0 0 0 2.5px var(--fg), 5px 5px 0 -1.5px var(--panel), 5px 5px 0 0 var(--bd); }
/* NEW: a box that lives in another view, shown at the edge of this one */
.nd.near { border-radius:13px; font-size:11.5px; font-weight:550; }
.nd .sw, .r .sw { display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--k); margin-right:6px; }
.lab { position:absolute; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; white-space:nowrap; } .lab.gone { color:var(--del); }
.ed { color:var(--muted); }
.ed .ln { fill:none; stroke:currentColor; stroke-width:1.3; }
.only .nd.same { opacity:.5; } .only .nd.sel { opacity:1; } .ed polygon, .ed circle { fill:currentColor; }
.ed .hit { fill:none; stroke:transparent; stroke-width:12; pointer-events:stroke; cursor:pointer; }
.ed text { font:9.5px system-ui, sans-serif; fill:currentColor; paint-order:stroke; stroke:var(--panel); stroke-width:3.5px; stroke-linejoin:round; }
.ed.con .ln { stroke-width:2.4; } .ed.sel .ln { stroke-width:3; }

/* the strip under the figure */
.strip { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; min-height:132px; font-size:13.5px; }
.strip .t { margin:0 0 6px; } .strip .t b { font-weight:650; } .strip .m { color:var(--muted); }
.strip .dl { display:flex; gap:8px; align-items:baseline; } .strip .dl .g { flex:0 0 12px; text-align:center; font-weight:700; }
.strip .dl.add .g { color:var(--add); } .strip .dl.chg .g { color:var(--chg); } .strip .dl.del .g { color:var(--del); }
.strip .hint { color:var(--muted); } .strip .all .dl { border-radius:4px; cursor:default; } .strip .all .dl:hover { background:color-mix(in srgb, var(--line) 40%, transparent); }
@media (min-width:1500px) { .strip .all { columns:2; column-gap:24px; } .strip .all .dl { break-inside:avoid; } }
.nd.ref { box-shadow:0 0 0 2px var(--fg); opacity:1 !important; }
.go { color:var(--accent); font-weight:600; margin-left:10px; } .strip .else { color:var(--muted); margin:6px 0 0 20px; font-size:12.5px; }

/* interfaces: functions and types, under the figure. Two styles and no more: code, in a monospaced face, with the name of a line in bold; and words, small and quiet. A line is a box's name or a signature; a line that changed carries a small mark in the margin. A line opens from itself and from nothing else */
code { font:12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; } code b { font-weight:600; }
.api { margin:0 0 8px; } .strip .hd { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:10px 0 3px; }
.fn { display:flex; gap:6px; align-items:baseline; font-size:13px; position:relative; } .fn > .g { flex:0 0 12px; text-align:center; font-weight:700; } .fn .m { color:var(--muted); } .fn > .ct { min-width:0; flex:1; }
.ct[data-fold] { cursor:pointer; } .ct[data-fold]:hover b, button.bx:hover { color:var(--accent); }
/* a signature that wraps hangs under itself */
.fn > .ct > code, .tr > code { display:block; padding-left:2ch; text-indent:-2ch; overflow-wrap:anywhere; } .fn button { text-indent:0; }
.fn.add > .g { color:var(--add); } .fn.chg > .g { color:var(--chg); } .fn.del > .g { color:var(--del); } .fn.del > .ct > code { color:var(--muted); text-decoration:line-through; }
.pv { color:var(--tc); }
/* everything shown at once, group by group: a box's name, in the same style whether it changed or not, then its lines */
.abox { margin:0 0 7px; } .bn { font-weight:650; } .bn .sn { color:var(--muted); font-weight:600; margin-right:6px; font-variant-numeric:tabular-nums; }
/* what an opened line has to say sits under it, behind a rule, and is built the same way at every depth: its words, then why it changed, then what it is made of. The words are one quiet style; the lines under them are lines like any other, with their marks in the gap beside the rule */
.inl { margin:1px 0 5px 18px; padding-left:18px; border-left:2px solid var(--line); } .inl .inl { margin-left:0; }
/* an opened line's words read as a docstring or a comment: the code's own face, all one grey, so the block under a line is one texture. What a line was is a comment too, with the old signature struck */
.wl { color:var(--tc); font:13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; padding-left:3ch; text-indent:-3ch; overflow-wrap:anywhere; } .wl code { font:inherit; }
.wl s { text-decoration:line-through; }
/* under an opened line, the change takes a little of the change colour and what the line was a little of the removed colour, so neither reads as the line's own words */
.wl.cn { color:var(--chg); } .wl.ws { color:color-mix(in srgb, var(--del) 70%, var(--muted)); }
.ct > .wl { display:block; }
.tr { display:flex; align-items:baseline; position:relative; } .tr > code { min-width:0; flex:1; }
.inl > .fn > .g, .tr > .g2 { position:absolute; left:-16px; width:12px; text-align:center; font-weight:700; font-size:12px; }
.tr.add, .tr.add .g2, .new { color:var(--add); } .tr.chg .g2 { color:var(--chg); } .tr.del, .old { color:var(--del); text-decoration:line-through; } .tr.del .g2 { text-decoration:none; }

/* files */
.scroll { overflow-x:auto; }
.tree { font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; width:max-content; min-width:100%; }
.r { display:flex; align-items:baseline; gap:8px; white-space:nowrap; padding-right:6px; }
.r .g { flex:0 0 14px; text-align:center; font-weight:700; } .r .p { font:12.5px/1.5 system-ui, sans-serif; color:var(--muted); }
.r.add .g, .r.add .n { color:var(--add); } .r.chg .g, .r.chg .n { color:var(--chg); } .r.del .g, .r.del .n { color:var(--del); } .r.del .n { text-decoration:line-through; }
.r.add .p, .r.chg .p, .r.del .p, .r .p.what { color:var(--fg); }
.diff .r.same { opacity:.5; } .diff .r.same.inside { opacity:1; }
.r .dots { color:var(--muted); }
.r.hot { background:var(--accent-soft); opacity:1 !important; }
.r[data-pick] { cursor:pointer; border-radius:4px; } .r[data-pick]:hover { background:color-mix(in srgb, var(--line) 40%, transparent); } .r.sel { box-shadow:inset 3px 0 0 var(--fg); background:color-mix(in srgb, var(--line) 55%, transparent); opacity:1 !important; }
.r .roll { font:600 12px/1.5 system-ui, sans-serif; display:inline-flex; gap:7px; font-variant-numeric:tabular-nums; }
.foot { font:12px/1.5 system-ui, sans-serif; color:var(--muted); margin:6px 0 0 22px; opacity:.8; }

/* one quiet line under the page: what it was built from, and anything the script had to say */
.built { margin-top:14px; border-top:1px dashed var(--line); padding-top:8px; color:var(--muted); font-size:12px; line-height:1.5; }
.built p { margin:0 0 2px; }

/* the listing under the figure is written as code: modules, functions, types and flows */
:root { --sel:#eef2fb; --hover:#f3f4f7; --chg-bg:#fbf1dd; --tk:#a626a4; --ts:#3f8f3d; --tn:#a8590b; --tf:#2f62d0; --tc:#7d828c; --gut:18px; --lv:4ch; }
@media (prefers-color-scheme: dark) { :root { --sel:#1f2738; --hover:#22252b; --chg-bg:#3a2e17; --tk:#d58ae8; --ts:#98c97a; --tn:#e0a565; --tf:#7fb0ff; --tc:#8a8f99; } }
@media (max-width: 760px) { :root { --lv:2ch; --gut:14px; } .fc { font-size:12px !important; } }
.t-k { color:var(--tk); } .t-s { color:var(--ts); } .t-n { color:var(--tn); } .t-f { color:var(--tf); } .t-d { color:var(--tf); font-weight:700; } .t-c { color:var(--tc); }
/* a module: its line of words as a comment, then its name. Modules inside it are indented by the margin where the marks go */
.mdoc { color:var(--tc); } .mh, .mdoc { font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; font-weight:400; } .mdoc.blk { display:block; }
.strip .abox { margin-bottom:10px; } .strip .abox > .bn { font-weight:400; } .strip p.t { margin-bottom:2px; }
.nk { padding-left:var(--gut); margin-top:4px; } .nk > .abox:last-child { margin-bottom:2px; }
button.bx:hover .t-d { text-decoration:underline; }
/* where the listing is, and the way back */
.crumbs { font-size:13px; color:var(--muted); margin:0 0 8px; } .crumbs button { color:var(--accent); font-weight:600; } .crumbs b { color:var(--fg); } .crumbs .go { margin-left:18px; }
.back { color:var(--accent); font-weight:600; font-size:13px; margin:0 0 8px; display:block; }
.strip p.fline { margin:0 0 8px; font-size:13px; } .strip p.fline code { font:600 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
/* a reference to a type, and the mark of a function that has a flow */
.ty[data-ty] { cursor:pointer; border-radius:3px; } .ty[data-ty]:hover { background:var(--sel); color:var(--accent); }
.fico { width:13px; height:13px; vertical-align:-2px; margin-left:1ch; color:var(--accent); fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; align-self:center; } .fico circle { fill:currentColor; stroke:none; }
/* a flow, open in place of its function's line: the body of that function as a sketch. A line that has something to say opens into a soft block */
.fn > .ct > .fc { margin-left:calc(-1 * var(--gut)); }
.fc { font:13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-width:0; }
.fc .fl { display:flex; align-items:baseline; border-radius:4px; min-width:0; }
.fc .fgut { flex:0 0 var(--gut); text-align:center; font-weight:700; color:var(--chg); user-select:none; } .fc .fgut.add { color:var(--add); } .fc .fgut.del { color:var(--del); }
.fc .tx, .fc .sg code { min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; font:inherit; } .fc .tx { flex:0 1 auto; }
.fc .fl.add .tx { color:var(--add); } .fc .fl.del .tx { color:var(--del); text-decoration:line-through; }
.fc .fl.can, .fc .fl.cl, .fc .fl.fhd { cursor:pointer; } .fc .fl.can:hover, .fc .fl.cl:hover { background:var(--hover); }
.fc .row.open > .fl { background:var(--sel); border-radius:4px 4px 0 0; }
.fc .row.open > .fl, .fc .x { box-shadow:inset 2px 0 0 color-mix(in srgb, var(--accent) 38%, var(--panel)); }
.fc .x { min-width:0; background:color-mix(in srgb, var(--sel) 72%, var(--panel)); border-radius:0 0 4px 4px; padding:5px 10px 7px 0; margin-bottom:5px; }
.fc .fl.lit, .fc .fl.cl.on { background:var(--chg-bg) !important; }
.fc .why { font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin-bottom:2px; }
.fc .sg { display:flex; gap:2px 16px; align-items:baseline; border-radius:4px; margin-top:3px; } .fc .sg code { padding-left:2ch; text-indent:-2ch; }
.fc .doc { padding-left:var(--lv); color:var(--tc); white-space:pre-wrap; overflow-wrap:anywhere; }
.fc .chgs { color:var(--chg); white-space:pre-wrap; overflow-wrap:anywhere; } .fc .x .chgs { padding-left:var(--lv); }
/* the name of a box beside a line, in its region's colour */
.fbx { flex:0 0 auto; margin-left:auto; font:12px system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--bd, var(--muted)); white-space:nowrap; cursor:pointer; background:color-mix(in srgb, var(--bd, var(--muted)) 12%, var(--panel)); padding:1px 8px; border-radius:9px; }
.fbx::after { content:" ↗"; } .fbx:hover { background:color-mix(in srgb, var(--bd, var(--muted)) 24%, var(--panel)); }
.r-entry { --bd:var(--entry); } .r-core { --bd:var(--core); } .r-ext { --bd:var(--ext); } .r-plat { --bd:var(--plat); } .r-sep { --bd:var(--muted); }
/* the card of a type or a module, where it is referred to */
#fcpop { position:absolute; z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.14); padding:9px 12px 10px; max-width:min(94vw, 700px); }
#fcpop .top { display:flex; gap:16px; justify-content:space-between; align-items:baseline; font:12.5px system-ui, -apple-system, sans-serif; color:var(--muted); margin-bottom:4px; }
#fcpop pre { margin:0; font:12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; }
/* the boxes an open flow passes are ringed; the others step back */
.nd.onflow { outline:2px solid var(--accent); outline-offset:1px; opacity:1 !important; } #fig.hasflow .nd:not(.onflow) { opacity:.45; }
/* a comparison in which nothing changed: the file list whole, folded and quiet */
.tree.calm .r { opacity:.62; } .tree.calm .r.hot, .tree.calm .r.sel { opacity:1; }
</style>
</head>
<body>
<main>
  <div id="nav"></div>
  <div class="ctl">
    <span class="pick" id="mode"></span>
    <span class="right"><button class="chip" id="fonly" title="List modules with their flows, not every function and type">Flows only</button><button class="chip" id="only">Changes only</button><span class="counts" id="counts"></span></span>
  </div>
  <div class="cols">
    <section class="pane"><div id="fig"></div><div class="strip" id="strip"></div></section>
    <section class="pane files"><div class="fhead"><button id="fold" title="Collapse to components" aria-label="Collapse to components"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 2.5 8 5.5l3.5-3M2 8h12M4.5 13.5 8 10.5l3.5 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="scroll"><div class="tree" id="tree"></div></div></section>
  </div>
  <div class="built" id="built"></div>
</main>

<script>
// ============ data ============
// Written by system_view.py. Lists hold everything any tab shows (views, api, types, flows, files); `snap` says, per tab, what is there and how it changed:
//   snap[tab].files[path]  add | chg | del, null when the file is not there; absent when unchanged
//   snap[tab].boxes[folder] the same for a box
//   snap[tab].lines[id]    { s, sig, was, line } for a function or a type, null when it is not there
//   snap[tab].changes      the named changes of that delta (indexes into `changes`); snap[tab].hits their lines
const S = __DATA__;
// ============ state ============
let openT = [], V, mode = 'cc', only = true, hov = null, pin = null, reveal = null, closed = new Set(), LAY = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const mark = { add:'+', chg:'~', del:'−' }, TABS = S.tabs, SN = () => S.snap[mode], delta = () => !!TABS.find(t => t.id === mode).delta;
S.files = S.files.map(f => ({ path:f[0], line:f[1] }));
if (S.api) { Object.keys(S.api).forEach(k => { S.api[k] = S.api[k].map(a => ({ sig:a[0], line:a[1], id:k + '#' + a[0].slice(0, a[0].search(/[^\p{L}\p{N}_.]/u) < 0 ? a[0].length : a[0].search(/[^\p{L}\p{N}_.]/u)) })); });
  Object.keys(S.types).forEach(k => { const a = S.types[k]; S.types[k] = { sig:a[0], line:a[1], home:a[2], name:k, id:k }; }); }
S.views.forEach(v => { if (v.id) { const b = S.views.flatMap(w => [...w.rows.flatMap(r => r.boxes), ...(w.band ? w.band.boxes : []), ...(w.sep || [])]).find(x => x.folder === v.id); v.name = b.name; v.line = b.line; } });
// ============ reading the snapshot of the tab being shown ============
const own = v => [...v.rows.flatMap(r => r.boxes), ...(v.band ? v.band.boxes : []), ...(v.sep || [])];
const regionsOf = v => [...v.rows, ...(v.band ? [v.band] : [])];
const boxAt = folder => { for (const v of S.views) { const b = own(v).find(x => x.folder === folder); if (b) return b; } };
const regionAt = id => { for (const v of S.views) { const r = regionsOf(v).find(x => x.id === id); if (r) return r; } };
// a folder stands for a region only when one region alone has it
const regionOfDir = dir => { const all = S.views.flatMap(regionsOf).filter(x => x.dir === dir); return all.length === 1 ? all[0] : undefined; };

  const many = (flows.length ? 1 : 0) + (rest.length ? 1 : 0) + (types ? 1 : 0) > 1, note = t => `<div class="fn"><span class="g"></span><span class="mdoc"># ${t}</span></div>`;
  return (flows.length ? note('flows') + flows.map(line).join('') : '') + (rest.length ? (many ? note('functions') : '') + rest.map(line).join('') : '') + (types ? (many ? note('types') : '') + types : ''); }

// ---- modules, two levels
const NODE = {};
function mkNode(b, parent){ const n = { folder:b.folder, name:b.name, line:b.line, parent, kids:[] }; NODE[n.folder] = n;
  const v = !parent && viewOf(n.folder); if (v) n.kids = v.rows.flatMap(r => r.boxes).map(x => mkNode(x, n)); return n; }
const TOP = own(S.views[0]).map(b => mkNode(b, null));
const nThere = n => bst(boxAt(n.folder)) !== null, pathOf = n => n.parent ? [...pathOf(n.parent), n] : [n];
const flowsIn = n => fnsOf(n.folder).filter(flowOf).length + n.kids.reduce((s, k) => s + flowsIn(k), 0);
// in a delta, a line that carries a mark is listed even where only flows are: what changed is never hidden
const marksIn = n => !delta() ? 0 : [...fnsOf(n.folder), ...card(n.folder).ts.map(t => S.types[t])].filter(markOf).length + (inside(card(n.folder)) ? 1 : 0) + n.kids.reduce((s, k) => s + marksIn(k), 0);
// a module's own lines: everything (less the types a module inside it lists), or only its flows and what changed. Its last line says what changed in code no listed line shows
// a function a module only passes on from a module inside it is that module's line: where only flows are listed, it is listed there and not twice
const passedOn = (n, f) => n.kids.some(k => fnsOf(k.folder).some(g => fnName(g) === fnName(f) && nowSig(g) === nowSig(f)));
function ownLines(n, all){ const c = card(n.folder), skip = new Set(n.kids.flatMap(k => card(k.folder).ts));
  if (all) return cardLines(c, skip, true);
  return c.fs.map(f => [f, c.key + '#' + fnName(f)]).filter(x => (flowOf(x[0]) || markOf(x[0])) && !passedOn(n, x[0])).map(x => fnLine(x[0], x[1])).join('')
    + c.ts.filter(t => !skip.has(t) && markOf(S.types[t])).map(t => typeRow(S.types[t], c.key + '|' + t, {})).join('') + insideLine(c, true); }
const nHead = (n, cur) => `<div class="bn"><span class="mdoc blk"># ${esc(n.line || '')}</span>${cur ? '' : `<button class="bx" data-nsel="${esc(n.folder)}">`}<code class="mh"><span class="t-k">module</span> <span class="t-d">${esc(camel(n.name))}</span>:</code>${cur ? '' : '</button>'}</div>`;
// one module and, indented inside it, its modules. all: every function and type; otherwise flows, and what changed. cur: the module the listing is about, which lists all its modules; elsewhere a module inside is listed only when it has something to show
function block(n, all, cur){ const kids = n.kids.filter(nThere).filter(k => all || cur || flowsIn(k) || marksIn(k));
  return `<div class="abox">${nHead(n, cur)}${ownLines(n, all)}${kids.length ? `<div class="nk">${kids.map(k => block(k, all)).join('')}</div>` : ''}</div>`; }
// where the listing is: every module above it leads back. `tail` names a region of the figure or a file, when one is selected
const crumbs = (n, tail) => { const v = !tail && viewOf(n.folder), p = pathOf(n);
  return `<div class="crumbs"><button data-ncrumb="">All modules</button>${p.map((x, i) => ' › ' + (tail || i < p.length - 1 ? `<button data-ncrumb="${esc(x.folder)}">${esc(x.name)}</button>` : `<b>${esc(x.name)}</b>`)).join('')}${tail ? ' › <b>' + esc(tail) + '</b>' : ''}${v && v !== V ? `<button class="go" data-go="${esc(n.folder)}">Open its view ›</button>` : ''}</div>`; };
// a file or a folder picked in the file list stands for the module it is in: that module is listed, under the file's own line
const MODOF = path => Object.values(NODE).filter(n => nThere(n) && path.startsWith(n.folder)).sort((a, b) => b.folder.length - a.folder.length)[0];
const pathOfPick = pick => pick && pick.startsWith('path:') ? pick.slice(5) : null, short = p => p.replace(/\/$/, '').split('/').pop() + (p.endsWith('/') ? '/' : '');
const fileLine = path => { const f = S.files.find(x => x.path === path); return `<p class="t fline"><code>${esc(short(path))}</code> <span class="m">${esc(f ? f.line : S.dirs[path] || '')}</span></p>`; };
// Flows only applies where modules hold modules that have flows: the overview, a module with modules inside. Anything else shows everything
const full = n => !n.kids.length || !FONLY || !flowsIn(n);
const regOf = pick => pick && pick.startsWith('region:') ? regionsOf(V).find(r => r.id === pick.slice(7)) : null, regNodes = r => r.boxes.map(b => NODE[b.folder]).filter(x => x && nThere(x));
function focan(){ if (!TOP.some(n => nThere(n) && flowsIn(n))) return false; if (!pin) return !V.id || flowsIn(NODE[V.id]) > 0;
  const p = pathOfPick(pin), pm = p && MODOF(p); if (pm) return pm.kids.length > 0 && flowsIn(pm) > 0;
  const r = regOf(p && regionOfDir(p) ? 'region:' + regionOfDir(p).id : pin); if (r) return regNodes(r).some(x => x.kids.length && flowsIn(x));
  const n = pin.startsWith('node:') && NODE[pin.slice(5)]; return !!n && n.kids.length > 0 && flowsIn(n) > 0; }
function LIST(pick){ const wrap = h => `<div class="api whole">${h}</div>`, here = V.id && NODE[V.id], p = pathOfPick(pick), pm = p && MODOF(p);
  if (pm) return p === pm.folder ? crumbs(pm) + wrap(block(pm, full(pm), true)) : crumbs(pm, short(p)) + fileLine(p) + wrap(block(pm, full(pm), true));          // a file: the module it is in
  const reg = regOf(p && regionOfDir(p) ? 'region:' + regionOfDir(p).id : pick);
  if (reg) { const ns = regNodes(reg), title = reg.title.replace(/<br>/g, ''), all = !FONLY || !ns.some(x => x.kids.length && flowsIn(x));                           // a region or a row of the figure: its modules
    return (here ? crumbs(here, title) : `<div class="crumbs"><button data-ncrumb="">All modules</button> › <b>${esc(title)}</b></div>`) + wrap(ns.map(x => block(x, all)).join('')); }
  const n = pick && pick.startsWith('node:') && NODE[pick.slice(5)];
  if (pick && !n) return '<button class="back" data-back>‹ All modules</button>' + describe(pick);                                                                    // a link of the figure, a file outside every module
  if (n) { if (pick !== lastPick) n.kids.forEach(k => closed.add(k.folder)); lastPick = pick; return crumbs(n) + wrap(block(n, full(n), true)); }                      // a module: as its own view lists it; in the file list its inner modules stay folded
  lastPick = pick;
  if (here) return crumbs(here) + wrap(block(here, full(here), true));                                                                                                // a module's own view
  if (!TOP.length) return describe(pick);
  const all = !FONLY || !TOP.some(flowsIn); return wrap(TOP.filter(nThere).map(x => block(x, all)).join('')); }                                                      // the overview: every module
// under the figure: the listing of what is selected. The boxes an open flow passes are ringed in the figure
function listing(pick){ const st = $('strip'), fo = $('fonly'); fo.hidden = !S.api; if (!S.api) { st.innerHTML = describe(pick); return; }
  fo.disabled = !focan(); fo.setAttribute('aria-pressed', FONLY && !fo.disabled);
  document.querySelectorAll('.onflow').forEach(x => x.classList.remove('onflow')); $('fig').classList.remove('hasflow');
  const ring = (f, cls) => [f, (rootBox(f) || {}).folder].forEach(x => document.querySelectorAll('.nd').forEach(el => { if (el.dataset.pick === 'node:' + x) el.classList.add(cls); }));
  const p = pathOfPick(pick), pm = p && MODOF(p); if (pm) ring(pm.folder, 'sel');
  SHOWN = []; st.innerHTML = LIST(pick);
  if (SHOWN.length) { $('fig').classList.add('hasflow'); uniq(SHOWN.flatMap(id => [id, ...(flowLines(id) || []).flatMap(l => l[3] || [])]).map(id => id.slice(0, id.lastIndexOf('#')))).forEach(f => ring(f, 'onflow')); } }
// selecting a module anywhere: the figure goes to the view that draws it
function nsel(folder){ const home = homeOf(folder); if (home && home !== V) go(home.id); pin = 'node:' + folder; reveal = folder; closed.delete(folder); show(); renderTree(); }
// the name of a box beside a called function: that module, with the function's flow open when it has one
function goBox(folder, fid){ if (fid) { const f = fnsOf(folder).find(x => x.id === fid), at = f && folder + '#' + fnName(f); if (at && !openT.includes(at)) openT.push(at); } nsel(folder); }
// with Changes only, a comparison in which nothing changed shows the whole file list folded to its top level and greyed, not an empty one. A selected module still shows just its own folder
function calmTree(top){ if (!only || !delta() || reveal) return false; const t = tally(''); if (t.add || t.chg || t.del) return false;
  const k = mode + '|' + V.id; if (k !== calmKey) { calmKey = k; (top || []).forEach(e => { if (!e.file) closed.add(e.path); }); } return true; }
// a tap on empty space in the figure returns to the plain listing: nothing selected, every opened flow and line closed
$('fig').addEventListener('click', e => { if (!e.target.closest('[data-pick]') && (openT.length || openF.size)) { openT = []; openF.clear(); show(); } });
document.addEventListener('click', e => { const t = e.target, inPop = t.closest('#fcpop');
  const bx = t.closest('.fbx'); if (bx) { hide(); goBox(bx.dataset.fbox, bx.dataset.fflow); return; }
  const ty = t.closest('.ty[data-ty]'); if (ty) { const at = inPop ? popEl : ty, again = !inPop && !pop.hidden && popEl === ty, name = ty.dataset.ty, d = typeCard(name); hide();
    if (!again && d) say(at, `<div class="top"><span>${esc(d.doc || '')}</span>${pill(d.folder)}</div>${d.extra}<pre>${d.lines.map(l => hl(l, name)).join('\n')}</pre>`); return; }
  if (!inPop) hide();
  const s = t.closest('[data-nsel]'), c = t.closest('[data-ncrumb]');
  if (s) { nsel(s.dataset.nsel); return; }
  if (c) { const f = c.dataset.ncrumb; if (!f) go(''); else if (f === V.id) { pin = null; reveal = null; show(); renderTree(); } else nsel(f); return; }
  if (t.closest('[data-back]')) { pin = null; reveal = null; show(); renderTree(); return; }
  if (!t.closest('.fc') || getSelection().toString()) return;
  const chg = t.closest('[data-chg]'), line = t.closest('.fl.can');
  if (chg) lit = lit === +chg.dataset.chg ? null : +chg.dataset.chg; else if (line) { const k = line.dataset.key; openF.has(k) ? openF.delete(k) : openF.add(k); } else return;
  show(); });
$('fonly').onclick = () => { FONLY = !FONLY; render(); };
mode = TABS.some(t => t.id === 'cc') ? 'cc' : TABS[0].id; V = S.views[0]; closed = folded(V); render();
</script>
